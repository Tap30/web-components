name: "🧑‍💻 Development"

on:
  pull_request:
    types:
      - opened
      - edited
      - synchronize
      - reopened

permissions:
  contents: read
  actions: read
  pull-requests: write

jobs:
  # Enforce that all PRs that change packages need changesets.
  # Changes without changesets result in this job failing.
  changeset-status-check:
    name: 🔍 Changeset Status Check
    runs-on: ubuntu-latest
    steps:
      - name: ☁️ checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🔧 setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: 🔧 setup node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: 📦 install dependencies
        run: |
          git checkout main
          git checkout ${{ github.sha }}
          pnpm install

      - name: 📋 Changeset status
        run: pnpm changesets:status

  lint:
    name: 🔍 Run linter
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: ☁️ checkout repository
        uses: actions/checkout@v4

      - name: 🔧 setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: 🔧 setup node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: 📦 install dependencies
        run: pnpm install

      # Set up GitHub Actions caching for Wireit.
      - name: 🔌 setup wireit cache
        uses: google/wireit@setup-github-actions-caching/v2

      - name: 🔍 lint code
        run: pnpm check:lint

      - name: 🔍 check code style
        run: pnpm check:format

  test:
    needs: lint
    name: 🧪 Run tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: ☁️ checkout repository
        uses: actions/checkout@v4

      - name: "🔧 setup pnpm"
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: "🔧 setup node"
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: 📦 install dependencies
        run: pnpm install

      - name: 🎭 install playwright
        run: pnpm playwright install --with-deps --only-shell

        # Set up GitHub Actions caching for Wireit.
      - name: 🔌 setup wireit cache
        uses: google/wireit@setup-github-actions-caching/v2

      # Plain, so the job fails on pnpm's exit code — that covers failing tests
      # and the 100% coverage threshold alike.
      - name: 🧪 run tests
        run: pnpm test

      - name: 🗄️ archive artifacts
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: |
            packages/react-ui/playwright-report/
            packages/react-ui/coverage/
          retention-days: 30

  trigger-review:
    name: Automatic Review
    needs: [changeset-status-check, lint, test]
    uses: ./.github/workflows/review.yml
