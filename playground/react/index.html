<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="/vite.svg"
    />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@100..900&display=swap"
      rel="stylesheet"
    />
    <script
      type="module"
      src="/src/index.tsx"
    ></script>
    <title>React Playground</title>
    <style>
      /*
        The document has no reset, so `body` keeps the UA's 8px margin. That is
        enough to push a full-height page past the viewport and give it a
        scrollbar with nothing to scroll to, which also throws the contents
        page's vertical centring off by the same 8px.

        Only `index.html` has this; `test.html` is the Playwright harness and is
        deliberately left exactly as the tests expect it.
      */
      body {
        margin: 0;
      }
    </style>
  </head>
  <body dir="rtl">
    <div id="root"></div>
  </body>
</html>
