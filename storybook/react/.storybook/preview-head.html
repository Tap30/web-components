<!--
  Vazirmatn is the Tapsi brand typeface. `--tapsi-typography-font-family` in
  @tapsioss/theme already resolves to `"Vazirmatn", sans-serif`, but the token
  only names the family — the font itself still has to be loaded. Without this
  every specimen silently falls back to the generic sans-serif.

  Mirrors the <head> of playground/index.html so both surfaces render identically.
-->
<link
  rel="preconnect"
  href="https://fonts.googleapis.com"
/>
<link
  rel="preconnect"
  href="https://fonts.gstatic.com"
  crossorigin
/>
<link
  href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@100..900&display=swap"
  rel="stylesheet"
/>
